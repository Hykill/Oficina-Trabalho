name: Deploy do front no GitHub Pages

on:
  push:
    branches: [main]
    paths: ['frontend/**', '.github/workflows/deploy-pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      # No Pages não existe o proxy do Vite: o front chama o Spring direto.
      # A variável API_URL (Settings > Secrets and variables > Actions > Variables)
      # pode sobrescrever; sem ela, usa o backend do Codespace "friendly goldfish".
      - run: npm run build
        env:
          VITE_API_URL: ${{ vars.API_URL || 'https://friendly-goldfish-6x6x75pw5643r67p-8080.app.github.dev' }}
      # Fallback de SPA: rotas como /clientes abrem o index.html
      - run: cp dist/index.html dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
