services:
  app:
    image: mcr.microsoft.com/devcontainers/java:1-21-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Compartilha a rede com o MySQL: o Spring acessa localhost:3306,
    # igual ao application.properties
    network_mode: service:db

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: oficina
    volumes:
      # Os dados continuam salvos quando o Codespace é desligado
      - mysql-data:/var/lib/mysql

volumes:
  mysql-data:
