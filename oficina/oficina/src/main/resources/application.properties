spring.datasource.url=jdbc:mysql://localhost:3306/oficina?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=root
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.connection.characterEncoding=utf8mb4
spring.jpa.properties.hibernate.connection.useUnicode=true

# Mostra a mensagem do ResponseStatusException no JSON de erro
spring.web.error.include-message=always
# Esconde a pilha de erros do Java (o DevTools liga isso por padrão)
spring.web.error.include-stacktrace=never